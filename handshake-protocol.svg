<svg viewBox="0 0 680 420" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Babel Tower Handshake Protocol</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text font-family="sans-serif" x="340" y="28" text-anchor="middle" fill="#534AB7" font-size="15" font-weight="500">Babel Tower Handshake Protocol</text>
  <text font-family="sans-serif" x="340" y="48" text-anchor="middle" fill="#7F77DD" font-size="12">Agent A finishes → notifies B via inbox → orchestrator wakes B → B continues</text>
  <text font-family="sans-serif" x="40" y="88" fill="#D85A30" font-size="13" font-weight="500">Step 1: Agent A completes subtask</text>
  <rect x="40" y="98" width="280" height="52" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text font-family="monospace" x="60" y="118" fill="#993C1D" font-size="11">A: babel-send --to B --type handoff</text>
  <text font-family="monospace" x="60" y="138" fill="#993C1D" font-size="11">   --subject "API done" --body "..."</text>
  <polyline points="180,150 180,170" fill="none" stroke="#F0997B" stroke-width="1" marker-end="url(#arr)"/>
  <text font-family="sans-serif" x="40" y="192" fill="#1D9E75" font-size="13" font-weight="500">Step 2: JSONL appended to B's inbox</text>
  <rect x="40" y="202" width="280" height="36" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text font-family="monospace" x="60" y="226" fill="#0F6E56" font-size="11">inbox/B.jsonl: {"type":"handoff", ...}</text>
  <polyline points="180,238 180,258" fill="none" stroke="#5DCAA5" stroke-width="1" marker-end="url(#arr)"/>
  <text font-family="sans-serif" x="40" y="280" fill="#185FA5" font-size="13" font-weight="500">Step 3: Orchestrator checks inbox</text>
  <rect x="40" y="290" width="280" height="52" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text font-family="monospace" x="60" y="310" fill="#185FA5" font-size="11">Orch: babel-check --all --unread</text>
  <text font-family="monospace" x="60" y="330" fill="#185FA5" font-size="11">→ B has 1 unread handoff message</text>
  <text font-family="sans-serif" x="370" y="88" fill="#534AB7" font-size="13" font-weight="500">Step 4: Orchestrator wakes Agent B</text>
  <rect x="370" y="98" width="280" height="36" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text font-family="monospace" x="390" y="122" fill="#3C3489" font-size="11">Orch → SendMessage(B, msg_content)</text>
  <polyline points="510,134 510,154" fill="none" stroke="#AFA9EC" stroke-width="1" marker-end="url(#arr)"/>
  <text font-family="sans-serif" x="370" y="176" fill="#639922" font-size="13" font-weight="500">Step 5: Agent B reads and continues</text>
  <rect x="370" y="186" width="280" height="52" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
  <text font-family="monospace" x="390" y="206" fill="#3B6D11" font-size="11">B reads inbox → understands context</text>
  <text font-family="monospace" x="390" y="226" fill="#3B6D11" font-size="11">→ continues from A's artifacts</text>
  <polyline points="510,238 510,258" fill="none" stroke="#97C459" stroke-width="1" marker-end="url(#arr)"/>
  <text font-family="sans-serif" x="370" y="280" fill="#D85A30" font-size="13" font-weight="500">Step 6: Agent B sends ack</text>
  <rect x="370" y="290" width="280" height="36" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text font-family="monospace" x="390" y="314" fill="#993C1D" font-size="11">B: babel-send --to A --type ack --reply-to msg_xxx</text>
  <polyline points="320,316 370,316" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,2"/>
  <text font-family="sans-serif" x="345" y="310" text-anchor="middle" fill="#534AB7" font-size="9">wake</text>
  <rect x="80" y="350" width="520" height="48" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text font-family="sans-serif" x="340" y="374" text-anchor="middle" fill="#444441" font-size="13" font-weight="500">Key insight: Babel Tower is not real-time — it's async persistence</text>
  <text font-family="sans-serif" x="340" y="390" text-anchor="middle" fill="#5F5E5A" font-size="11">The orchestrator polls inboxes each turn. No daemon, no cron needed.</text>
</svg>