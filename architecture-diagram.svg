<svg viewBox="0 0 680 580" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Babel Tower Architecture</title>
  <desc>Cross-platform agent communication system architecture</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 2L5 8L8 2" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text class="th" font-family="sans-serif" x="340" y="28" text-anchor="middle" fill="#534AB7" font-size="15" font-weight="500">Babel Tower — Cross-Platform Agent Communication</text>
  <rect x="40" y="44" width="600" height="50" rx="12" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text font-family="sans-serif" x="60" y="68" fill="#534AB7" font-size="13" font-weight="500">AI Platforms</text>
  <rect x="52" y="80" width="100" height="34" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text font-family="sans-serif" x="102" y="97" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">WorkBuddy</text>
  <rect x="170" y="80" width="100" height="34" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text font-family="sans-serif" x="220" y="97" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Claude Code</text>
  <rect x="288" y="80" width="90" height="34" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text font-family="sans-serif" x="333" y="97" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Codex CLI</text>
  <rect x="396" y="80" width="80" height="34" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text font-family="sans-serif" x="436" y="97" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Cursor</text>
  <rect x="494" y="80" width="80" height="34" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text font-family="sans-serif" x="534" y="97" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Other</text>
  <polyline points="92,114 92,140 190,140 190,152" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow-down)"/>
  <polyline points="220,114 220,140 220,152" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow-down)"/>
  <polyline points="333,114 333,140 250,140 250,152" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow-down)"/>
  <polyline points="460,114 460,140 320,140 320,152" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow-down)"/>
  <text font-family="sans-serif" x="340" y="136" text-anchor="middle" fill="#888780" font-size="11">File System I/O (read/write inbox)</text>
  <rect x="150" y="156" width="380" height="40" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text font-family="sans-serif" x="190" y="180" fill="#0F6E56" font-size="13" font-weight="500">Skill Layer: babel-tower (cross-platform loadable)</text>
  <text font-family="sans-serif" x="480" y="180" fill="#1D9E75" font-size="11">Protocol adapter</text>
  <polyline points="340,196 340,220" fill="none" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow-down)"/>
  <rect x="80" y="224" width="520" height="180" rx="16" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
  <text font-family="sans-serif" x="105" y="250" fill="#D85A30" font-size="14" font-weight="500">Babel Tower Core (workspace/babel-tower/)</text>
  <rect x="100" y="262" width="230" height="130" rx="10" fill="#FFFFFF" stroke="#F0997B" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text font-family="sans-serif" x="120" y="284" fill="#993C1D" font-size="12" font-weight="500">Task-scoped</text>
  <rect x="110" y="296" width="210" height="26" rx="6" fill="#FAECE7"/>
  <text font-family="sans-serif" x="125" y="313" dominant-baseline="central" fill="#993C1D" font-size="11">tasks/TASK-xxx/babel-tower/</text>
  <rect x="110" y="328" width="100" height="22" rx="5" fill="#FFF" stroke="#F5C4B3" stroke-width="0.5"/>
  <text font-family="sans-serif" x="160" y="343" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-size="10">inbox/lu-ban.jsonl</text>
  <rect x="218" y="328" width="100" height="22" rx="5" fill="#FFF" stroke="#F5C4B3" stroke-width="0.5"/>
  <text font-family="sans-serif" x="268" y="343" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-size="10">inbox/shan-dian.jsonl</text>
  <rect x="110" y="356" width="100" height="22" rx="5" fill="#FFF" stroke="#F5C4B3" stroke-width="0.5"/>
  <text font-family="sans-serif" x="160" y="371" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-size="10">inbox/chui-zi.jsonl</text>
  <rect x="218" y="356" width="100" height="22" rx="5" fill="#FFF" stroke="#F5C4B3" stroke-width="0.5"/>
  <text font-family="sans-serif" x="268" y="371" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-size="10">manifest.yaml</text>
  <rect x="345" y="262" width="240" height="130" rx="10" fill="#FFFFFF" stroke="#F0997B" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text font-family="sans-serif" x="365" y="284" fill="#993C1D" font-size="12" font-weight="500">Global inbox</text>
  <rect x="355" y="296" width="220" height="26" rx="6" fill="#FAECE7"/>
  <text font-family="sans-serif" x="370" y="313" dominant-baseline="central" fill="#993C1D" font-size="11">babel-tower/inbox/global/</text>
  <rect x="355" y="328" width="100" height="22" rx="5" fill="#FFF" stroke="#F5C4B3" stroke-width="0.5"/>
  <text font-family="sans-serif" x="405" y="343" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-size="10">pythagoras.jsonl</text>
  <rect x="463" y="328" width="110" height="22" rx="5" fill="#FFF" stroke="#F5C4B3" stroke-width="0.5"/>
  <text font-family="sans-serif" x="518" y="343" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-size="10">da-vinci.jsonl</text>
  <text font-family="sans-serif" x="465" y="376" fill="#993C1D" font-size="10">Cross-task notifications</text>
  <rect x="120" y="424" width="440" height="44" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text font-family="sans-serif" x="340" y="442" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="13" font-weight="500">File System — The Universal Common Denominator</text>
  <text font-family="sans-serif" x="340" y="458" text-anchor="middle" dominant-baseline="central" fill="#7F77DD" font-size="11">JSONL append-write + file locks + sidecar state tracking</text>
  <polyline points="215,392 215,424" fill="none" stroke="#F0997B" stroke-width="1" marker-end="url(#arrow-down)"/>
  <polyline points="465,392 465,424" fill="none" stroke="#F0997B" stroke-width="1" marker-end="url(#arrow-down)"/>
  <rect x="590" y="228" width="78" height="172" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
  <text font-family="sans-serif" x="629" y="248" text-anchor="middle" fill="#3B6D11" font-size="11" font-weight="500">Scripts</text>
  <line x1="600" y1="254" x2="658" y2="254" stroke="#97C459" stroke-width="0.5"/>
  <text font-family="sans-serif" x="629" y="270" text-anchor="middle" fill="#639922" font-size="10">babel-init</text>
  <text font-family="sans-serif" x="629" y="288" text-anchor="middle" fill="#639922" font-size="10">babel-send</text>
  <text font-family="sans-serif" x="629" y="306" text-anchor="middle" fill="#639922" font-size="10">babel-check</text>
  <text font-family="sans-serif" x="629" y="324" text-anchor="middle" fill="#639922" font-size="10">babel-summary</text>
  <line x1="600" y1="332" x2="658" y2="332" stroke="#97C459" stroke-width="0.5"/>
  <text font-family="sans-serif" x="629" y="348" text-anchor="middle" fill="#639922" font-size="10">Protocols</text>
  <text font-family="sans-serif" x="629" y="366" text-anchor="middle" fill="#639922" font-size="10">Schema</text>
  <text font-family="sans-serif" x="629" y="384" text-anchor="middle" fill="#639922" font-size="10">Templates</text>
  <rect x="40" y="480" width="280" height="90" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text font-family="sans-serif" x="55" y="500" fill="#444441" font-size="12" font-weight="500">Message Types (12)</text>
  <text font-family="sans-serif" x="55" y="520" fill="#5F5E5A" font-size="11">task_assign / task_report / handoff / query</text>
  <text font-family="sans-serif" x="55" y="540" fill="#5F5E5A" font-size="11">block / unblock / ack / broadcast / close</text>
  <text font-family="sans-serif" x="55" y="560" fill="#5F5E5A" font-size="11">plan_req / plan_resp / summary</text>
  <rect x="340" y="480" width="300" height="90" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text font-family="sans-serif" x="355" y="500" fill="#185FA5" font-size="12" font-weight="500">Handshake Protocol</text>
  <text font-family="sans-serif" x="355" y="520" fill="#378ADD" font-size="11">A done -> babel-send handoff -> B inbox</text>
  <text font-family="sans-serif" x="355" y="540" fill="#378ADD" font-size="11">Orchestrator babel-check -> wake B</text>
  <text font-family="sans-serif" x="355" y="560" fill="#378ADD" font-size="11">B reads inbox -> continues -> ack</text>
</svg>